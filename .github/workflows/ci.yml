name: CI


on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  # Floor is 3.12 (see the comment on requires-python in pyproject.toml).
  PYTHON_VERSION: "3.12"

jobs:
  lint:
    name: Lint (ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Install ruff
        run: pip install ruff
      - name: Ruff check
        run: ruff check .
      - name: Ruff format (check only)
        run: ruff format --check .

  typecheck:
    name: Type check (mypy)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
      - name: Install package + type stubs
        run: pip install -e .[dev]
      - name: mypy
        run: mypy tokenizer dataset model attention training inference optimization benchmark

  test:
    name: Tests (pytest, py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 3.14 is the version this project is developed on; 3.12 is the floor.
        python-version: ["3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install package
        run: pip install -e .[dev]
      - name: Run tests with coverage
        run: pytest --cov=tokenizer --cov=dataset --cov=model --cov=attention --cov=training --cov=inference --cov=optimization --cov=benchmark --cov-report=term-missing

  import-smoke:
    name: Import smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
      - name: Install package
        run: pip install -e .
      - name: Modules import cleanly
        run: |
          python -c "import tokenizer, dataset, model, attention, training, inference, optimization, benchmark; print('all modules import OK')"
          python -c "from tokenizer import BPE; t=BPE(vocab_size=256); ids=t.encode('hello'); assert t.decode(ids)=='hello'; print('tokenizer smoke OK')"
          python -c "
          import torch
          from attention import CausalAttention
          from dataset import DataEngine
          e = DataEngine.from_config({'dataset': {'source': 'synthetic', 'seq_len': 16, 'batch_size': 2}}, vocab_size=64)
          b = e.next_batch()
          assert b['input_ids'].shape == (2, 16)
          a = CausalAttention(d_model=32, n_heads=4, n_kv_heads=2, max_seq_len=64).eval()
          out, cache = a(torch.randn(2, 16, 32), use_cache=True)
          assert out.shape == (2, 16, 32) and len(cache) == 16
          print('dataset + attention smoke OK')
          "
      - name: Training entry point runs
        run: python -m training.train --config configs/default.yaml dataset.batch_size=2 dataset.seq_len=32
