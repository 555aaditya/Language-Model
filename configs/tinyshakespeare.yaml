# A ready-to-run config over the TinyShakespeare corpus (public domain).
#
# Prepare the corpus once, then train:
#
#   python -m dataset.prepare_corpus --corpus tinyshakespeare --vocab-size 8192
#   python -m training.train --config configs/tinyshakespeare.yaml
#
# Sized from a measured run rather than guessed. The first attempt at 2000 steps
# was 41.6 epochs over a 295k-token corpus at 26 parameters per token: training
# loss fell 5.26 -> 1.86 while validation perplexity bottomed at 98.9 around
# step 500 and then climbed to 304.6. The model was memorising, and because
# checkpoints were periodic the best weights were never saved.
#
# So: fewer steps, evaluate 2.5x more often, save on improvement, and stop early
# when four consecutive evaluations fail to improve. Expect validation to turn
# upward before training does — with a corpus this small that is arithmetic, not
# a bug, and it is exactly what the held-out split is for.

seed: 42
device: auto            # auto | mps | cuda | cpu

model:
  d_model: 256
  n_layers: 6
  n_heads: 8
  n_kv_heads: 2
  d_ff: 1024
  vocab_size: 8192      # must match the trained tokenizer
  max_seq_len: 256
  rope_theta: 10000.0
  dropout: 0.1          # a corpus this small needs the regularisation
  tie_weights: true

attention:
  impl: sdpa
  kv_cache: true

dataset:
  source: file
  path: data/tinyshakespeare/train.bin
  val_path: data/tinyshakespeare/val.bin
  seq_len: 256
  batch_size: 24
  num_workers: 0

training:
  steps: 800
  lr: 6.0e-4
  min_lr: 6.0e-5
  warmup_steps: 100
  weight_decay: 0.1
  grad_clip: 1.0
  amp: true
  amp_dtype: bfloat16
  grad_accum_steps: 1
  log_every: 100
  eval_every: 100
  eval_batches: 20
  early_stop_patience: 4
  ckpt_every: 0           # best.pt is saved on improvement instead
  out_dir: checkpoints/tinyshakespeare
